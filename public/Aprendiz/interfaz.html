<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema Escolar - Colegio San José</title>
  <link rel="stylesheet" href="interfaz.css">
</head>
<body> 
  <header class="header">
    <div class="user-profile">
      <span class="user-name">Estefany Sofia Hernández</span>
      <div class="avatar-circle">
        <i data-lucide="user"></i> 
        <img src="/public/Material/perfil.png">
      </div> 
    </div>
  </header> 
  <main class="main-container"> 
    <section class="left-panel">
      <div class="search-box">
        <input type="text" placeholder="Buscar">
        <button type="button" class="search-btn" aria-label="Buscar">
          <i data-lucide="search"></i>
        </button>
      </div> 
      <a href="reporte.html">Reportes</a> 
      <button class="action-btn">Preinforme</button>
    </section> 
    <section class="right-panel">
      <div class="logo-container">
        <img src="/public/Material/escudo_sanjose-1.jpg" alt="Escudo Colegio San José" class="school-badge">
      </div>
    </section>
</body>
</html>
